<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-8+c5CZYopi/rCTGAuTPJ33+xEeIre215libG3CDDPKc=' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://ecjeyelgcqbliavwltbc.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>SWISHBY 관리자</title>
<style>
:root{color-scheme:dark;--sky-0:#0d0820;--sky-1:#140c2b;--sky-2:#1d1440;--line:#2c2152;--ink:#f3eefc;--ink-2:#b8afd6;--ink-3:#7f77a3;--cool:#4ff0ff;
  --s1:#1ea2b6;--s2:#8b6cf2;--s3:#b9842a;--good:#4fd69c;--warn:#ffd25a;--crit:#ff4f8b;
  --kr:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;--num:"Chakra Petch",var(--kr);--disp:"Bungee",var(--num)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--sky-0);color:var(--ink);font:14px/1.5 var(--kr);-webkit-text-size-adjust:100%}
:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--sky-0);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font:20px/1 var(--disp);color:var(--cool);white-space:nowrap}
.brand span{font:600 14px var(--kr);color:var(--ink-2);margin-left:8px}
.who{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px;color:var(--ink-2)}
#who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
@media (max-width:480px){#who{max-width:28vw}}
main{max-width:1200px;margin:0 auto;padding:12px 16px 48px}
h1{font-size:20px;margin:0 0 8px}
h2{font-size:16px;margin:28px 0 8px}
button{font:inherit;color:var(--sky-0);background:var(--cool);border:0;border-radius:6px;padding:6px 12px;font-weight:600;cursor:pointer;min-height:34px;white-space:nowrap}
button.ghost{background:var(--sky-2);color:var(--ink);border:1px solid var(--line)}
button.ghost:hover{border-color:var(--ink-3)}
button.danger{background:var(--crit);color:var(--sky-0)}
button.sm{min-height:28px;padding:2px 8px;font-size:12px}
button.link{background:none;border:0;color:var(--cool);padding:0;min-height:0;font-weight:600;text-align:left;text-decoration:underline;text-underline-offset:3px;white-space:normal;word-break:break-all}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;color:var(--ink);background:var(--sky-2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:34px;min-width:0}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 20px;scrollbar-width:none}
.tabs button{background:none;color:var(--ink-2);border-radius:0;border-bottom:2px solid transparent;padding:8px 10px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--cool)}
.tabs button.own1{margin-left:10px;position:relative}
.tabs button.own1::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;border-left:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--sky-1);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.card h3{margin:0 0 6px;font-size:14px;color:var(--ink-2);font-weight:600}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0}
dl.kv dt{color:var(--ink-2)}
dl.kv dd{margin:0;text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;word-break:break-all}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin:8px 0 16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{color:var(--ink-2);font-weight:600;background:var(--sky-1)}
td.n,th.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
td.w{white-space:normal;word-break:break-word;min-width:200px;max-width:460px}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;font-size:12px;line-height:18px;padding:0 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);margin-right:4px}
.tag.bad{color:var(--crit);border-color:var(--crit)}
.tag.ok{color:var(--good);border-color:var(--good)}
.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.tool input{flex:1 1 180px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.dim{color:var(--ink-2)}
.mono{font-family:var(--num);font-size:12px;word-break:break-all}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;margin:4px 0;max-height:240px;overflow:auto}
details summary{cursor:pointer;color:var(--cool);font-size:12px}
.banner{border:1px solid var(--crit);background:var(--sky-1);border-radius:10px;padding:8px 12px;margin:0 0 12px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.center{max-width:420px;margin:32px auto}
.col{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.row{display:flex;gap:8px;margin:8px 0}
.row input{flex:1}
.msg{min-height:1.5em;color:var(--warn)}
.danger-zone{border-color:var(--crit)}
.modal{position:fixed;inset:0;background:rgba(13,8,32,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.mbox{background:var(--sky-1);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:420px;width:100%}
.mbox p{white-space:pre-wrap;word-break:break-word}
.mbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--sky-1);border:1px solid var(--cool);border-radius:10px;padding:8px 14px;z-index:30;max-width:calc(100% - 32px)}
/* the one loud thing: today's sky */
.hero{display:grid;grid-template-columns:minmax(220px,auto) 1fr;gap:8px 32px;align-items:end;margin:4px 0 20px}
.hero h1{font-size:16px;font-weight:600;color:var(--ink-2);margin:0}
.hero-n{font:56px/1.05 var(--disp);color:var(--ink);margin:6px 0 4px}
.hero-s{color:var(--ink-2);margin:0}
.hero-s.quiet{color:var(--ink-3)}
.hero .fig{margin:0}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero-n{font-size:36px}}
.up::before{content:"▲ ";color:var(--good)} .down::before{content:"▼ ";color:var(--crit)}
.vitals{display:grid;grid-template-columns:1.6fr repeat(4,1fr);gap:1px;background:var(--line);border-block:1px solid var(--line);margin:0 0 12px}
.vital{background:var(--sky-0);padding:14px 16px;min-width:0}
.vital h3{margin:0;font-size:12px;font-weight:600;color:var(--ink-2)}
.vital-n{font:600 28px/1.2 var(--num);margin:2px 0}
.vital p{margin:0;font-size:12px;color:var(--ink-2)}
@media (max-width:760px){.vitals{grid-template-columns:1fr 1fr}.vital:first-child{grid-column:1/-1}.vital{padding:12px 4px}}
.split{display:flex;gap:2px;height:8px;margin:8px 0 6px}
.split i{display:block;height:100%;border-radius:2px}
.keys{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.keys span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--k)}
.keys.lines span::before{height:2px;width:12px;vertical-align:middle}
dl.facts{display:flex;flex-wrap:wrap;gap:6px 24px;margin:0 0 8px;font-size:13px}
dl.facts div{display:flex;gap:8px}
dl.facts dt{color:var(--ink-2)}
dl.facts dd{margin:0;font-family:var(--num)}
.st{display:inline-flex;gap:6px;align-items:baseline;white-space:nowrap}
.st b{font-family:var(--num)}
.st.good b{color:var(--good)} .st.warn b{color:var(--warn)} .st.crit b{color:var(--crit)} .st.off b{color:var(--ink-3)}
/* charts: inline SVG at the panel's own width */
.fig{position:relative;margin:0 0 16px;background:var(--sky-1);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.hero .fig{background:none;border:0;padding:0}
.fig figcaption{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;margin:0 0 6px}
.fig-t{font-weight:600}
.fig-s{font-size:12px;color:var(--ink-2)}
.plot{min-height:40px}
.chart{display:block;overflow:visible;cursor:crosshair;touch-action:pan-y}
.chart:focus-visible{outline-offset:4px}
.chart text{font:12px var(--num);fill:var(--ink-3);font-variant-numeric:tabular-nums}
.chart text.lbl{fill:var(--ink-2);font-family:var(--kr)}
.chart text.val{fill:var(--ink-2)}
.chart .crit{fill:var(--crit);font-weight:600}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .cross{stroke:var(--ink-3);stroke-width:1}
.chart .dot{stroke:var(--sky-1);stroke-width:2}
.chart .mk{stroke:var(--ink-2);stroke-width:1}
.chart .on{filter:brightness(1.25)}
.hero .chart .dot{stroke:var(--sky-0)}
.glow{filter:drop-shadow(0 0 6px var(--cool))}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}}
.tip{position:absolute;z-index:4;pointer-events:none;background:var(--sky-2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;min-width:120px;max-width:260px}
.tip-t{color:var(--ink-2);margin-bottom:2px;word-break:break-all}
.tip-r{display:flex;gap:8px;align-items:center;white-space:nowrap}
.tip-r b{font:600 14px var(--num);color:var(--ink)}
.tip-r span{color:var(--ink-2)}
.tip-r i{display:inline-block;width:12px;height:2px;background:var(--k)}
.twin{margin-top:8px}
.twin .tw{margin-bottom:0}
.tbl-btn{margin-top:4px}
.range{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.range button{background:none;color:var(--ink-2);border-radius:0;min-height:30px}
.range button[aria-pressed="true"]{background:var(--sky-2);color:var(--ink)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:760px){.pair{grid-template-columns:1fr}}
.empty{color:var(--ink-2);margin:8px 0}
ul.cron{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.cron li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:4px 16px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
ul.cron .sub{font-size:12px;color:var(--ink-2);font-family:var(--num)}
@media (max-width:520px){ul.cron li{grid-template-columns:88px minmax(0,1fr)}ul.cron li>:last-child{grid-column:2}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
</head>
<body>
<header class="top">
  <div class="brand">SWISHBY<span>관리자</span></div>
  <div class="who"><span id="who"></span><span id="roleTag" class="tag" hidden></span><button id="outBtn" class="ghost sm" hidden>로그아웃</button></div>
</header>
<main>
<div id="banner" class="banner" hidden><span id="bannerTxt"></span><button id="bannerX" class="ghost sm">닫기</button></div>

<section id="boot" class="center"><p class="dim">불러오는 중…</p></section>

<section id="login" class="center card" hidden>
  <h1>관리자 로그인</h1>
  <p class="dim">관리자로 등록된 계정만 들어올 수 있습니다. 게스트 계정으로는 쓸 수 없습니다.</p>
  <div class="col">
    <button id="gBtn">Google로 로그인</button>
    <button id="aBtn">Apple로 로그인</button>
  </div>
  <form id="mailForm" class="row"><input id="mailIn" type="email" autocomplete="email" placeholder="이메일 주소" aria-label="이메일 주소"><button>코드 받기</button></form>
  <form id="codeForm" class="row" hidden><input id="codeIn" inputmode="numeric" autocomplete="one-time-code" placeholder="이메일로 받은 코드" aria-label="코드"><button>확인</button></form>
  <p id="loginMsg" class="msg"></p>
</section>

<section id="denied" class="center card" hidden>
  <h1 id="deniedTitle">권한이 없습니다</h1>
  <p id="deniedTxt" class="dim"></p>
  <div class="acts"><button id="deniedOut">로그아웃</button><button id="deniedRetry" class="ghost">다시 확인</button></div>
</section>

<section id="app" hidden>
  <nav id="tabs" class="tabs" role="tablist" aria-label="관리 메뉴"></nav>
  <div id="mfaNote" class="banner" hidden><span>관리 기능은 2단계 인증 뒤에 열립니다.</span><button id="mfaNoteBtn" class="sm">2단계 인증</button></div>
  <div id="view"></div>
</section>
</main>

<div id="modal" class="modal" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <p id="mBody"></p>
    <div class="mbtns"><button id="mNo" class="ghost">취소</button><button id="mOk">확인</button></div>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(() => {
'use strict';
/* admin:start — pure helpers (no DOM): tab rights, input checks, rpc arguments, error text, display formats. tests/admin.test.js */
const ADM_TABS = [
  {id: 'overview', label: '개요', owner: false}, {id: 'kpi', label: '지표', owner: false}, {id: 'players', label: '플레이어', owner: false},
  {id: 'reports', label: '신고', owner: false}, {id: 'season', label: '시즌', owner: false}, {id: 'errors', label: '오류', owner: false},
  {id: 'testers', label: '테스터', owner: true}, {id: 'referrals', label: '추천', owner: true}, {id: 'log', label: '기록', owner: true}
];
const ADM_REASONS = {name: '닉네임', cheat: '부정행위', other: '기타'};
const ADM_UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
// admin_me's answer → 'owner' | 'mod' | null (anything unexpected is no access)
const admRole = me => me && typeof me === 'object' && me.admin === true && (me.role === 'owner' || me.role === 'mod') ? me.role : null;
const admTabs = role => role === 'owner' ? ADM_TABS.slice() : role === 'mod' ? ADM_TABS.filter(t => !t.owner) : [];
const admCan = (role, tab) => admTabs(role).some(t => t.id === tab);
const admOwnerTab = tab => ADM_TABS.some(t => t.id === tab && t.owner);
// The server asks for a second factor (aal2) on every admin call, owner and mod alike: below aal2 every tab waits for the TOTP step
const admAal = me => me && typeof me === 'object' && (me.aal === 'aal1' || me.aal === 'aal2') ? me.aal : null;
const admOwnerReady = (role, aal) => role === 'owner' && aal === 'aal2';
const admNeedMfa = (role, aal) => (role === 'owner' || role === 'mod') && aal !== 'aal2';
const admMfaCode = s => { const v = typeof s === 'string' ? s.replace(/\s+/g, '') : ''; return /^\d{6}$/.test(v) ? v : ''; };
// The enrolment QR: only an SVG data URL (the SDK prefixes the raw SVG without escaping it, so it is re-encoded here)
function admQrSrc(s){
  const v = typeof s === 'string' ? s : '', m = v.match(/^data:image\/svg\+xml;(?:utf-8|charset=utf-8),([\s\S]*)$/);
  if (!m || !/^\s*<svg[\s>]/.test(m[1])) return '';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(m[1]);
}
const admStr = v => typeof v === 'string' ? v : '';
const admUuid = s => { const v = admStr(s).trim().toLowerCase(); return ADM_UUID.test(v) ? v : ''; };
function admInt(v, lo, hi, def){
  const n = typeof v === 'number' ? v : typeof v === 'string' && v.trim() !== '' ? Number(v) : NaN;
  return Number.isFinite(n) ? Math.min(hi, Math.max(lo, Math.trunc(n))) : def;
}
const admEmail = s => { const v = admStr(s).trim().toLowerCase(); return v.length <= 254 && /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) ? v : ''; };
const admCode = s => { const v = admStr(s).replace(/\s+/g, ''); return /^\d{6,10}$/.test(v) ? v : ''; };
// The retyped id must be exactly the player's id (as shown, lower case): the server checks p_confirm = p_id::text again
const admDeleteOk = (typed, id) => { const u = admUuid(id); return !!u && admStr(typed).trim() === u; };
// Who may be offered the delete button: owner only, never oneself or another admin (the server refuses those too)
const admCanDelete = (role, p, self) => role === 'owner' && !!p && !!admUuid(p.id) && p.id !== self && !p.admin_role;
// rpc arguments, one builder per call of the contract (docs/admin.md §2); null = the input is not valid, nothing is sent
const admArgs = {
  kpi: d => ({p_days: admInt(d, 1, 120, 30)}),
  players: (q, limit, offset) => ({p_q: admStr(q).trim().slice(0, 64),p_limit: admInt(limit, 1, 200, 50), p_offset: admInt(offset, 0, 1e9, 0)}),
  player: id => admUuid(id) ? {p_id: admUuid(id)} : null,
  hidden: (id, on) => admUuid(id) ? {p_id: admUuid(id), p_hidden: on === true} : null,
  resetNick: id => admUuid(id) ? {p_id: admUuid(id)} : null,
  reports: limit => ({p_limit: admInt(limit, 1, 200, 100)}),
  reportsClear: (target, reason) => admUuid(target) && ['name', 'cheat', 'other', 'all'].includes(reason) ? {p_target: admUuid(target), p_reason: reason} : null,
  testerSet: (id, on, note) => admUuid(id) ? {p_id: admUuid(id), p_on: on === true, p_note: admStr(note).trim().slice(0, 100)} : null,
  errors: limit => ({p_limit: admInt(limit, 1, 200, 50)}),
  referralRelease: inviter => admUuid(inviter) ? {p_inviter: admUuid(inviter)} : null,
  deletePlayer: (id, typed) => admDeleteOk(typed, id) ? {p_id: admUuid(id), p_confirm: admUuid(id)} : null,
  log: limit => ({p_limit: admInt(limit, 1, 200, 100)})
};
// A server / network error → a short Korean line (fw_admin → 권한 없음, fw_bad_input → 입력 오류)
function admErr(e){
  const o = e && typeof e === 'object' ? e : {}, c = String(o.code || ''), m = String(o.message || '');
  if (/fw_admin_mfa/.test(m)) return '2단계 인증 필요';
  if (c === '42501' || /fw_admin/.test(m)) return '권한 없음';
  if (c === '22023' || /fw_bad_input/.test(m)) return '입력 오류';
  if (o.status === 401 || c === 'PGRST301' || /jwt/i.test(m)) return '로그인 만료 — 다시 로그인하세요';
  if (c === 'PGRST202' || c === '42883') return '서버 함수 없음 — 마이그레이션 확인';
  if (o.name === 'TypeError' || /failed to fetch|network/i.test(m)) return '네트워크 오류';
  return '서버 오류';
}
const admErrText = e => { const k = admErr(e), m = String((e && e.message) || '').slice(0, 200); return m ? `${k} (${m})` : k; };
// Sign-in errors are shown as fixed lines only: a URL's error_description is attacker-controlled text and is never displayed
const ADM_AUTH_ERR = {
  access_denied: '로그인을 취소했거나 거부되었습니다', otp_expired: '로그인 코드나 링크가 만료되었습니다', otp_disabled: '이메일 로그인이 꺼져 있습니다',

// Horizontal bars, one per row (most first): rows [{label, value, solid?, hot, tip:[…rows], pick}]; marker = a reference line with its label.
// With solid, a bar is two parts of one hue: solid (what the marker is about) and the rest as a 40% tint, a 2px surface gap between
function barChart(o){
  if (!o.rows.length) return figure({...o, draw: () => empty(o.none)});
  return figure({...o, draw: (w, fig, plot, tip) => {
    const n = o.rows.length, LW = w < 480 ? 96 : 150, R = 44, rowH = 30, bh = 18, T = o.marker ? 20 : 4, H = T + n * rowH + 20;
    const ticks = admTicks([...o.rows.map(r => r.value), o.marker || 0], !!o.int), x = admScale(0, ticks[2], LW, w - R);
    const svg = sv('svg', {class: 'chart', width: w, height: H, viewBox: `0 0 ${w} ${H}`, role: 'img', 'aria-label': o.aria});
    for (const t of ticks) svg.append(sv('line', {class: 'grid', x1: admR(x(t)), x2: admR(x(t)), y1: T, y2: H - 20}), sv('text', {x: admR(x(t)), y: H - 4, 'text-anchor': 'middle'}, admTick(t)));
    const bars = o.rows.map((r, i) => {
      const yy = T + i * rowH + (rowH - bh) / 2, len = x(r.value || 0) - LW;
      svg.append(sv('text', {class: 'lbl', x: LW - 8, y: admR(yy + bh - 4), 'text-anchor': 'end'}, r.hot ? sv('tspan', {class: 'crit'}, '! ') : null, admClip(r.label || '(이름 없음)', LW < 120 ? 7 : 12)));
      const hue = r.hot ? C.crit : C.s1, sg = r.solid == null ? null : admSegs(r.solid, r.value), b = sv('g', {});
      if (!sg) b.append(sv('path', {d: admHBar(LW, yy, len, bh), fill: hue}));
      else {
        const sl = x(sg.solid) - LW, gap = sg.solid && sg.rest ? 2 : 0;
        if (sg.solid) b.append(sv('path', {d: admHBar(LW, yy, sl, bh, sg.rest ? 0 : 4), fill: hue}));
        if (sg.rest) b.append(sv('path', {d: admHBar(LW + sl + gap, yy, len - sl - gap, bh), fill: hue, 'fill-opacity': 0.4}));
      }
      svg.append(b, sv('text', {class: 'val', x: admR(LW + Math.max(0, len) + 6), y: admR(yy + bh - 4)}, o.fmt(r.value)));
      return b;
    });
    if (o.marker){ const mx = admR(x(o.marker)); svg.append(sv('line', {class: 'mk', x1: mx, x2: mx, y1: T - 4, y2: H - 20}), sv('text', {x: mx, y: T - 8, 'text-anchor': 'middle'}, o.markerLabel)); }
    const pick = (px, py) => Math.max(0, Math.min(n - 1, Math.floor((py - T) / rowH)));
    interact(svg, fig, plot, tip, n, pick, i => {
      bars.forEach((b, k) => b.classList.toggle('on', k === i));
      if (i < 0) return null;
      const r = o.rows[i];
      return {x: x(r.value || 0), y: T + i * rowH, title: r.label || '(이름 없음)', rows: r.tip};
    }, o.pick ? i => o.pick(o.rows[i]) : null);
    return svg;
  }});
}

/* ---------- confirm dialog (in-page; every write asks first) ---------- */
let modalRes = null;
function ask(title, body, okText = '확인', danger = false){
  if (modalRes) closeModal(false);
  return new Promise(res => {
    modalRes = res;
    $('mTitle').textContent = title; $('mBody').textContent = body; $('mOk').textContent = okText; $('mOk').className = danger ? 'danger' : '';
    $('modal').hidden = false; $('mNo').focus();
  });
}
function closeModal(v){ $('modal').hidden = true; const r = modalRes; modalRes = null; if (r) r(v); }

$('mNo').addEventListener('click', () => closeModal(false));

/* ---------- server calls ---------- */
async function rpc(name, args){
  let r;
  try { r = args ? await sb.rpc(name, args) : await sb.rpc(name); } catch(e){ r = {error: e || {}}; }
  if (r.error && r.status && !r.error.status) r.error.status = r.status;
  return r;
}
// A read for a view: the data, or the error thrown to the view's error box
async function need(name, args){ const r = await rpc(name, args); if (r.error) throw r.error; return r.data; }
// One write: confirm, call, report; after() redraws on success
async function write(q, name, args, after, btn){
  if (!args) return banner('입력 오류 (값을 확인하세요)');
  if (!(await ask(q.title, q.body, q.ok || '확인', !!q.danger))) return;
  if (btn) btn.disabled = true;
  const r = await rpc(name, args);
  if (btn) btn.disabled = false;
  if (r.error) return banner(admErrText(r.error));
  banner(''); toast(q.done || '완료했습니다');
  if (after) after(r.data);
}

/* ---------- second factor (TOTP): enrol once, then a 6-digit code each session; the server then sees aal2 ---------- */
async function vMfa(){
  const f = await sb.auth.mfa.listFactors();
  if (f.error) throw f.error;
  const all = (f.data && f.data.all) || [], ok = all.find(x => x.factor_type === 'totp' && x.status === 'verified');
  const msg = el('p', {id: 'mfaMsg', class: 'msg'});
  const form = run => {
    const code = el('input', {id: 'mfaCode', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: 8, placeholder: '6자리 코드', 'aria-label': '인증 코드'});
    const btn = el('button', {id: 'mfaGo', text: '확인'});
    return el('form', {class: 'tool', onsubmit: async e => {
      e.preventDefault();
      const c = admMfaCode(code.value);
      if (!c){ msg.textContent = '6자리 코드를 입력하세요'; return; }
      btn.disabled = true;
      let r; try { r = await run(c); } catch(err){ r = {error: err}; }
      btn.disabled = false;
      if (!r || r.error){ msg.textContent = '코드가 맞지 않거나 만료되었습니다'; code.value = ''; return; }
      msg.textContent = ''; mfaDone();
    }}, code, btn);
  };
  const box = el('div', {class: 'card', id: 'mfaBox'}, el('h3', {text: '2단계 인증 필요'}),
    el('p', {class: 'dim', text: '모든 관리 기능(owner와 mod 모두)은 인증 앱(TOTP) 확인 뒤에 열립니다. 처음이면 인증 앱을 한 번 등록하고, 그다음부터는 접속할 때마다 6자리 코드를 입력합니다.'}));
  if (ok){
    box.append(el('p', {text: '인증 앱에 표시된 6자리 코드를 입력하세요.'}), form(c => sb.auth.mfa.challengeAndVerify({factorId: ok.id, code: c})), msg);
    return box;
  }
  const go = el('button', {id: 'mfaEnroll', type: 'button', text: '인증 앱 등록 시작', onclick: async () => {
    go.disabled = true; msg.textContent = '';
    for (const x of all) if (x.factor_type === 'totp' && x.status !== 'verified') await sb.auth.mfa.unenroll({factorId: x.id}).catch(() => {});   // the QR of an earlier, unfinished try
    let r; try { r = await sb.auth.mfa.enroll({factorType: 'totp', friendlyName: 'SWISHBY admin'}); } catch(err){ r = {error: err}; }
    if (r.error || !r.data || !r.data.id){ go.disabled = false; msg.textContent = '등록을 시작하지 못했습니다 (' + admErr(r.error) + ')'; return; }
    const id = r.data.id, t = r.data.totp || {}, qr = admQrSrc(t.qr_code);
    go.replaceWith(el('div', {},
      el('p', {text: '인증 앱(Google Authenticator, 1Password 등)으로 QR을 찍거나 아래 키를 입력한 뒤, 표시된 6자리 코드를 입력하세요.'}),
      qr ? el('img', {id: 'mfaQr', src: qr, alt: '인증 앱 등록 QR', width: 180, height: 180, style: 'background:#fff;border-radius:8px;padding:6px'}) : null,
      el('p', {id: 'mfaSecret', class: 'mono', text: admStr(t.secret)}),
      form(async c => { const ch = await sb.auth.mfa.challenge({factorId: id}); return ch.error ? ch : sb.auth.mfa.verify({factorId: id, challengeId: ch.data.id, code: c}); })));
  }});
  box.append(go, msg);
  return box;
}
// After a verify the SDK holds the aal2 session; admin_me is asked again so the page follows what the server now sees
async function mfaDone(){
  await sb.auth.getSession().catch(() => {});
  const r = await rpc('admin_me');
  if (!r.error){ role = admRole(r.data); aal = admAal(r.data); }
  paintRole();
  if (!role){ selfId = null; return start(); }
  if (admNeedMfa(role, aal)) return banner('2단계 인증이 아직 반영되지 않았습니다. 다시 시도하세요');
  banner(''); toast('2단계 인증을 마쳤습니다');
  show(tab === 'mfa' ? 'overview' : tab);
}

/* ---------- sign-in ---------- */
const say = t => { $('loginMsg').textContent = t; };
async function start(){
  const n = ++startN;
  const { data } = await sb.auth.getSession().catch(() => ({data: {}}));
  const u = data && data.session && data.session.user;
  if (n !== startN) return;
  if (!u || u.is_anonymous !== false){ role = null; aal = null; selfId = null; $('who').textContent = ''; paintRole(); return screen('login'); }
  if (u.id === selfId && role) return;   // a token refresh: nothing changed
  $('who').textContent = u.email || u.id;
  const r = await rpc('admin_me');
  if (n !== startN) return;
  role = r.error ? null : admRole(r.data);
  aal = r.error ? null : admAal(r.data);
  selfId = u.id;
  paintRole();
  if (!role){
    $('deniedTitle').textContent = r.error ? '확인할 수 없습니다' : '권한이 없습니다';
    $('deniedTxt').textContent = r.error ? admErrText(r.error) : `${u.email || u.id} 계정은 관리자로 등록되어 있지 않습니다.`;
    return screen('denied');
  }
  screen('app'); show('overview');
}
async function signOut(){ try { await sb.auth.signOut({scope: 'local'}); } catch(e){} role = null; selfId = null; start(); }
const back = () => location.origin + location.pathname;
async function oauth(provider){
  say('');
  let r; try { r = await sb.auth.signInWithOAuth({provider, options: {redirectTo: back()}}); } catch(e){ r = {error: e}; }
  if (r && r.error) say(admAuthErr(r.error, '로그인을 시작하지 못했습니다'));
}
$('gBtn').addEventListener('click', () => oauth('google'));
$('aBtn').addEventListener('click', () => oauth('apple'));
$('mailForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = admEmail($('mailIn').value); if (!email) return say('이메일 주소를 확인하세요');
  let r; try { r = await sb.auth.signInWithOtp({email, options: {shouldCreateUser: false, emailRedirectTo: back()}}); } catch(err){ r = {error: err}; }
  if (r.error) return say(admAuthErr(r.error, '코드를 보내지 못했습니다 (등록된 계정인지 확인하세요)'));
  mail = email; $('codeForm').hidden = false; $('codeIn').value = ''; $('codeIn').focus(); say(`${email}로 코드를 보냈습니다`);
});
$('codeForm').addEventListener('submit', async e => {
  e.preventDefault();
  const token = admCode($('codeIn').value); if (!token || !mail) return say('코드를 확인하세요');
  let r; try { r = await sb.auth.verifyOtp({email: mail, token, type: 'email'}); } catch(err){ r = {error: err}; }
  if (r.error) return say(admAuthErr(r.error, '코드가 맞지 않거나 만료되었습니다'));
  mail = ''; $('codeForm').hidden = true; say(''); start();
});
$('outBtn').addEventListener('click', signOut);
$('deniedOut').addEventListener('click', signOut);
$('deniedRetry').addEventListener('click', () => { role = null; selfId = null; start(); });
$('mfaNoteBtn').addEventListener('click', () => show('mfa'));
// Providers switched off in the project are hidden (the public auth settings, as the game reads them)
async function providers(){
  try {
    const j = await (await fetch(CFG.url + '/auth/v1/settings', {headers: {apikey: CFG.key}})).json(), x = j && j.external;
    if (x && typeof x === 'object'){ $('gBtn').hidden = x.google === false; $('aBtn').hidden = x.apple !== true; }
  } catch(e){}
}

function boot(){
  // Never inside someone else's frame (clickjacking): a line of text, and no Supabase client at all
  let framed = true; try { framed = window.top !== window.self; } catch(e){}
  if (framed){ document.body.replaceChildren(el('p', {class: 'center', text: '이 페이지는 다른 페이지 안에서 열 수 없습니다.'})); return; }
  // Fonts (Bungee for the wordmark and the hero number, Chakra Petch for figures) arrive late on purpose: a stylesheet in <head>
  // would hold every script behind Google's response; until it lands the system fonts stand in
  document.head.append(el('link', {rel: 'stylesheet', href: 'https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600&display=swap'}));
  const cb = admCallback(location.href);
  if (cb.err){ history.replaceState(null, '', cb.clean); banner(cb.err); }
  if (!window.supabase || !window.supabase.createClient){ screen('denied'); $('deniedTitle').textContent = '불러오지 못했습니다'; $('deniedTxt').textContent = 'Supabase SDK를 불러오지 못했습니다. 네트워크를 확인하고 새로고침하세요.'; return; }
  // Its own session, apart from the game's (same origin): its own storage key, in sessionStorage, so no script of the game page can
  // read the aal2 token and the game's sign-out never touches it. The session ends with the tab; sign in again in a new one.
  sb = window.supabase.createClient(CFG.url, CFG.key, {auth: {storageKey: 'sb-swishby-admin', storage: window.sessionStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit'}});
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT' || ev === 'USER_UPDATED') setTimeout(start, 0); });   // no Supabase call inside the callback
  providers();
  start();
}
boot();
})();
</script>
