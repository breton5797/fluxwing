<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Flux Wing 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: one full-screen canvas stage, HTML overlays for menus and leaderboard, a thumb-reach dash button bottom-right */
:root{
  --bg:#07050f;
  --ink:#f3eefc;
  --dim:#a39bbf;
  --hot:#ff4f8b;
  --cool:#4ff0ff;
  --gold:#ffd25a;
  --panel:rgba(14,10,30,.86);
  --line:rgba(243,238,252,.16);
  --cjk:"Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans","Noto Sans JP","PingFang SC","Microsoft YaHei","Malgun Gothic",system-ui,sans-serif;
  --display:"Bungee","Impact",var(--cjk);
  --body:"Chakra Petch","Segoe UI",var(--cjk);
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;height:100%;width:100%;max-width:560px;margin:0 auto;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:16px;padding:24px 16px;text-align:center;overflow-y:auto;touch-action:pan-y;background:radial-gradient(ellipse at 50% 40%,rgba(7,5,15,.35),rgba(7,5,15,.84))}
.logo{font-family:var(--display);font-size:clamp(44px,13vw,72px);line-height:.9;letter-spacing:.02em;background:linear-gradient(180deg,var(--ink) 20%,var(--hot) 55%,var(--cool));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,79,139,.45))}
.year{font-family:"Bungee",Impact,sans-serif;font-size:15px;letter-spacing:.5em;color:var(--cool);margin-top:-4px;padding-left:.5em}
.tag{color:var(--dim);font-size:15px;max-width:32ch;line-height:1.5;text-wrap:balance}
.feat{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:360px}
.chip{font-size:12px;font-weight:600;letter-spacing:.06em;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink)}
.chip::before{content:"●";color:var(--gold);margin-right:5px;font-size:9px;vertical-align:1px}
.modes{display:flex;flex-direction:column;gap:12px;width:min(300px,100%)}
.btn{font-family:var(--display);font-size:20px;letter-spacing:.04em;color:var(--bg);background:var(--ink);border:0;border-radius:999px;padding:13px 26px;cursor:pointer;box-shadow:0 0 0 3px rgba(255,79,139,.6),0 0 30px rgba(255,79,139,.5);transition:transform .12s;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
.btn small{font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.04em;opacity:.8;font-variant-numeric:tabular-nums}
.btn.alt{background:rgba(14,10,30,.6);color:var(--ink);box-shadow:0 0 0 2px var(--cool),0 0 26px rgba(79,240,255,.35)}
.btn.alt small{color:var(--cool);opacity:1}
.btn:hover{transform:scale(1.04)}
.btn:focus-visible,.ghost:focus-visible,select:focus-visible,.tab:focus-visible,input:focus-visible{outline:3px solid var(--cool);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.ghost{background:rgba(14,10,30,.5);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:9px 16px;font:600 13px var(--body);letter-spacing:.04em;cursor:pointer}
.ghost:hover{border-color:var(--cool)}
select.ghost{appearance:none;-webkit-appearance:none;padding-right:16px}
select.ghost option{background:#140e26;color:var(--ink)}
.keys{display:grid;grid-template-columns:auto auto;gap:6px 14px;font-size:13px;color:var(--dim);text-align:left}
.keys b{color:var(--ink);font-weight:700;letter-spacing:.06em}
.card{box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px;width:min(386px,100%);display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(6px)}
.over-title{font-family:var(--display);font-size:30px;color:var(--hot);letter-spacing:.04em}
.modetag{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--cool)}
.big{font-family:"Bungee",Impact,sans-serif;font-size:60px;line-height:1;font-variant-numeric:tabular-nums}
.rank{font-family:var(--display);font-size:20px;color:var(--gold)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;padding:8px;border-radius:10px;background:rgba(243,238,252,.05)}
.stat span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.stat strong{font-size:20px;font-variant-numeric:tabular-nums}
.newbest{font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--cool)}
.place{font-size:14px;font-weight:700;color:var(--gold);min-height:1.2em}
.hint{font-size:12px;color:var(--dim);letter-spacing:.06em}
/* leaderboard */
.lbcard{max-height:100%;min-height:0;text-align:left}
.lbhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lbhead h2{font-family:var(--display);font-size:24px;margin:0;color:var(--ink);letter-spacing:.03em}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:999px;background:rgba(243,238,252,.06)}
.tab{border:0;border-radius:999px;padding:8px;background:none;color:var(--dim);font:700 13px var(--body);letter-spacing:.06em;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.dayline{font-size:12px;color:var(--dim);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.lblist{list-style:none;margin:0;padding:0;overflow-y:auto;min-height:120px;max-height:46vh;touch-action:pan-y;display:flex;flex-direction:column;gap:2px}
.lbrow{display:grid;grid-template-columns:2.2em 1.7em minmax(0,1fr) auto;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;font-size:15px}
.lbrow:nth-child(odd){background:rgba(243,238,252,.04)}
.lbrow .n{font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.lbrow.top .n{color:var(--gold)}
.lbrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .sc{font-family:"Bungee",Impact,sans-serif;font-variant-numeric:tabular-nums}
.lbrow.me{background:rgba(79,240,255,.14);box-shadow:inset 0 0 0 1px rgba(79,240,255,.5)}
.lbrow .me-tag{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--cool);margin-left:6px}
.lbempty{padding:22px 8px;text-align:center;color:var(--dim);font-size:14px}
.lbstatus{font-size:12px;color:var(--dim);min-height:1.2em}
.nickrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nickrow label{font-size:12px;color:var(--dim);letter-spacing:.06em;width:100%}
.nickrow input{flex:1;min-width:0;background:rgba(243,238,252,.06);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font:600 15px var(--body);user-select:text;-webkit-user-select:text;touch-action:auto}
#dashBtnOLD{position:absolute;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;border:2px solid var(--line);background:rgba(14,10,30,.6);color:var(--ink);font-family:"Bungee",Impact,sans-serif;font-size:14px;letter-spacing:.06em;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s,box-shadow .2s,border-color .2s}
/* action buttons: conic gauge ring around a dark core */
.abtn{--p:0;--ring:var(--cool);position:absolute;bottom:calc(66px + env(safe-area-inset-bottom,0px));width:78px;height:78px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:conic-gradient(var(--ring) calc(var(--p) * 1turn), rgba(243,238,252,.12) 0);display:grid;place-items:center;transition:transform .1s,box-shadow .2s;touch-action:none}
.abtn > span{width:66px;height:66px;border-radius:50%;background:rgba(10,7,22,.88);display:grid;place-items:center;align-content:center;gap:1px;color:var(--ink);font:13px "Bungee",Impact,var(--cjk);letter-spacing:.04em;text-align:center;line-height:1.05}
.abtn small{font:700 10px var(--body);letter-spacing:.02em;color:var(--dim);max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abtn.ready{box-shadow:0 0 24px var(--ring);animation:pulse2 1s infinite}
.abtn:active{transform:scale(.92)}
.abtn:focus-visible{outline:2px solid var(--cool);outline-offset:3px}
#dashBtn{right:14px}
#skillBtn{right:102px;--ring:var(--gold)}
@keyframes pulse2{50%{box-shadow:0 0 38px var(--ring)}}
#topBtns{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:8px}
.ib{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(14,10,30,.55);color:var(--ink);font:700 15px var(--body);cursor:pointer}
.ib::after{content:"";position:absolute;inset:-4px;border-radius:50%}   /* 46px touch target around the 38px button */
.ib:focus-visible,#dashBtn:focus-visible{outline:2px solid var(--cool);outline-offset:3px}
@keyframes pulse{50%{box-shadow:0 0 34px rgba(79,240,255,.95)}}
/* menu: logo animation, start button, mode pair */
.logowrap{position:relative;animation:float 4s ease-in-out infinite}
.logo{position:relative;background-size:100% 100%}
.logo::after{content:"FLUX\A WING";white-space:pre;position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.85) 50%,transparent 65%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.2s ease-in-out infinite;pointer-events:none}
.logo-txt{display:block}
@keyframes shine{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}
@keyframes float{50%{transform:translateY(-6px)}}
.startbig{width:min(300px,100%);font-size:26px;padding:15px 26px;letter-spacing:.12em;animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 4px rgba(255,79,139,.75),0 0 44px rgba(255,79,139,.7)}}
.mode2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(300px,100%)}
.btn.sm{font-size:15px;padding:10px 8px;min-width:0}
.btn.sm small{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.vsbtn{box-shadow:0 0 0 2px var(--hot),0 0 22px rgba(255,79,139,.35)!important}
.vsbtn small{color:var(--hot)!important}
/* generic modal card bits */
.mtitle{font-family:var(--display);font-size:24px;margin:0;letter-spacing:.03em}
.stages{display:block;max-height:60vh;overflow-y:auto}
.sthead{padding:8px 10px;border-radius:10px;font:700 12px var(--body);color:#fff}
.strule{font-weight:600;font-size:11px;opacity:.85;margin-top:2px}
.stgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 14px}
.stc{position:relative;min-height:54px;border-radius:10px;border:1px solid var(--line);background:rgba(14,10,30,.7);color:#fff;font:700 15px var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.stc small{font:600 10px var(--body);opacity:.8}
.stc.done{border-color:var(--gold)}
.stc.cur{outline:2px solid var(--cool)}
.stc[disabled]{cursor:default;filter:grayscale(.85) brightness(.55)}
.stc .lk{position:absolute;inset:auto 4px 3px auto;font-size:9px;color:var(--ink);opacity:.9}
.stc:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.stnote{font:600 11px var(--body);color:var(--ink);opacity:.75;text-align:center}
.helpcard p{margin:0;font-size:14px;line-height:1.55;color:var(--ink)}
.helpcard p b{color:var(--cool)}
.vscard{text-align:center}
.tierbox{display:flex;align-items:center;justify-content:center;gap:10px;font:700 14px var(--body)}
.tierbadge{font:15px "Bungee",Impact,sans-serif;padding:4px 12px;border-radius:999px;color:#0b0718}
.vsbtns{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.vsbtns .ghost{padding:12px;font-size:14px}
.coderow{display:flex;gap:8px}
.coderow input{flex:1;min-width:0;text-align:center;letter-spacing:.4em;font:20px "Bungee",Impact,sans-serif;background:rgba(243,238,252,.06);border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--ink);user-select:text;-webkit-user-select:text;touch-action:auto}
.bigcode{font:44px "Bungee",Impact,sans-serif;letter-spacing:.25em;color:var(--gold)}
.vsstatus{font-size:13px;color:var(--dim);min-height:1.3em}
.vsnote{font-size:11.5px;color:var(--dim);line-height:1.45}
.contcard{text-align:center;align-items:center}
.cring{--p:1;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--hot) calc(var(--p)*1turn), rgba(243,238,252,.12) 0);display:grid;place-items:center}
.cring span{width:70px;height:70px;border-radius:50%;background:#120c24;display:grid;place-items:center;font:28px "Bungee",Impact,sans-serif}
.contcard .ghost,.confcard .ghost{width:100%;padding:12px;font-size:14px;display:inline-flex;justify-content:center;align-items:center;gap:6px}
.contcard .ghost.primary,.confcard .ghost.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#confScr{z-index:8}
#contScr,#vsScr,#stageScr,#helpScr{z-index:6}
.confcard{text-align:center;white-space:pre-line;font-size:16px;line-height:1.5}
.confbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#tip{position:absolute;left:50%;top:auto;bottom:calc(158px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 40px);padding:12px 18px;border-radius:16px;background:rgba(10,7,22,.86);border:1px solid var(--cool);box-shadow:0 0 24px rgba(79,240,255,.35);color:var(--ink);font:700 15px var(--body);text-align:center;pointer-events:none;z-index:4;animation:tipIn .35s ease-out}
@keyframes tipIn{from{opacity:0;transform:translate(-50%,10px)}}
.hg-stats em{font-style:normal;font:700 11px var(--body);color:var(--ink);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.hg-stats{grid-template-columns:auto 1fr auto!important}
.hg-skill{margin:0;font-size:12.5px;line-height:1.45;color:var(--gold);text-wrap:pretty}
.hg-skill b{color:var(--ink)}
#over:not([hidden]) .card{animation:cardIn .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.88)}to{opacity:1;transform:none}}
.rank.stamp{animation:stamp .42s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{0%{opacity:0;transform:scale(2.8) rotate(-14deg)}60%{opacity:1;transform:scale(.9) rotate(-3deg)}100%{transform:scale(1) rotate(-4deg)}}
.newbest:not([hidden]){animation:nbGlow .9s ease-in-out infinite alternate}
@keyframes nbGlow{to{text-shadow:0 0 14px var(--cool);transform:scale(1.06)}}
#vibBtn.off{opacity:.4}
#vibBtn svg{width:18px;height:18px;vertical-align:-3px}
/* hangar (bird select) */
.hangar{box-sizing:border-box;width:min(354px,100%);display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(14,10,30,.62);backdrop-filter:blur(4px)}
.hg-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.hg-row{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center}
.hg-arrow{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(243,238,252,.06);color:var(--ink);font:700 22px var(--body);line-height:1;cursor:pointer}
.hg-arrow:hover{border-color:var(--cool)}
.hg-arrow:focus-visible{outline:2px solid var(--cool);outline-offset:3px}
#hgCv{width:100%;max-width:180px;height:86px;justify-self:center}
.hg-name{font-family:"Bungee",Impact,sans-serif;font-size:28px;line-height:1;letter-spacing:.04em}
.hg-role{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--dim);margin-top:-2px}
.hg-chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.hg-chips:empty{display:none}
.hg-stats{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;align-items:center;text-align:left;margin-top:4px}
.hg-stats span{font-size:12px;color:var(--dim);letter-spacing:.04em;white-space:nowrap}
.pips{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.pips i{height:7px;border-radius:2px;background:rgba(243,238,252,.12)}
.hg-passive{margin:2px 0 0;font-size:13px;line-height:1.45;color:var(--ink);text-wrap:pretty}
.hg-dots{display:flex;gap:2px;width:100%}   /* one tappable segment per unit on a single row; a wider gap starts each rarity group */
.rar.ultra{background:linear-gradient(90deg,#ff7ad9,#ffd25a,#4ff0ff,#b18cff)!important}
.hg-name.ultra #hgName{background:linear-gradient(90deg,#ff7ad9,#ffd25a,#4ff0ff,#b18cff);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.hg-dots button{--c:rgba(243,238,252,.22);position:relative;flex:1 1 0;min-width:0;height:16px;padding:0;border:0;background:none;cursor:pointer}
.hg-dots button::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:var(--c)}
.hg-dots button.grp{margin-left:4px}
.hg-dots button[aria-current="true"]::before{height:10px;margin-top:-5px;border-radius:3px;box-shadow:0 0 8px var(--c)}
.hg-dots button:focus-visible{outline:2px solid var(--cool);outline-offset:1px}
.hg-info{display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;scrollbar-width:none}
.hg-info::-webkit-scrollbar{display:none}
.hg-info.clip{padding-bottom:12px;-webkit-mask-image:linear-gradient(#000 calc(100% - 18px),transparent);mask-image:linear-gradient(#000 calc(100% - 18px),transparent)}
.bdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
/* wallet, rarity, shop, rewards */
.wallet{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:10px;display:flex;gap:3px;align-items:center;flex-wrap:nowrap;max-width:calc(100% - 140px);z-index:3}
.wpill{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 8px;border-radius:999px;background:rgba(14,10,30,.7);border:1px solid var(--line);font:700 12px var(--body);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
button.wpill{cursor:pointer}
.wallet .wpill{padding:0 6px;gap:4px}
@media (max-width:379px){.wallet .lvbar{display:none}}   /* three currency pills: the XP bar gives way on narrow screens */
button.wpill:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.ic{display:inline-block;flex:none}
.ic.coin{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.ic.dia{width:8px;height:8px;margin:0 2px;transform:rotate(45deg);background:var(--cool)}
.ic.gem{width:12px;height:12px;background:linear-gradient(135deg,#ffb3dc,#ff4f8b);clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%)}
.lvbar{width:22px;height:5px;border-radius:3px;background:rgba(243,238,252,.15);overflow:hidden}
.lvbar i{display:block;height:100%;background:var(--cool)}
.rar{display:inline-block;font:700 10px var(--body);letter-spacing:.14em;padding:3px 8px;border-radius:999px;margin-left:8px;vertical-align:7px;color:#0b0718}
.hg-lock{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.hg-lock .ghost{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;min-height:44px}
.hg-lock .ghost.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hg-lock .costs{width:100%;display:flex;justify-content:center;gap:14px;font:700 13px var(--body);font-variant-numeric:tabular-nums}
.hg-lock .cost{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.hg-lock .cost.short{color:var(--hot)}
.hg-lock .note{width:100%;font-size:12px;color:var(--dim)}
.hangar.premium{border-color:rgba(255,210,90,.45);box-shadow:0 0 24px rgba(255,210,90,.12)}
.shopcard{max-height:100%;min-height:0;text-align:left}
.shop-list{display:flex;flex-direction:column;gap:10px;overflow-y:auto;touch-action:pan-y;min-height:0}
.sitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(243,238,252,.05);border:1px solid var(--line)}
.sitem.hero{border-color:rgba(255,210,90,.6);background:linear-gradient(135deg,rgba(255,210,90,.14),rgba(255,79,139,.10))}

.sitem small{grid-column:1;color:var(--dim);font-size:12px;line-height:1.4}
.sitem .ghost{grid-row:1 / 3;grid-column:2;font-variant-numeric:tabular-nums}
.sitem .ghost[disabled]{opacity:.5;cursor:default}
.testbar{font-size:12px;line-height:1.45;color:var(--gold);border:1px dashed rgba(255,210,90,.5);border-radius:10px;padding:8px 10px}
.rewards{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.lvup{font-family:var(--display);color:var(--cool);font-size:18px;letter-spacing:.04em}
.trialtag{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--gold)}

@media (max-height:900px){.tag{display:none}}
@media (max-height:820px){.logo{font-size:44px}}
@media (max-height:720px){.keys,.hg-passive{display:none}}
@media (hover:none) and (pointer:coarse){.keys{display:none}}
/* fitMenu() adds .tight when the menu would not fit on one screen: flavour text and key hints go, spacing tightens */
#menu.tight{gap:12px;padding-bottom:14px}
#menu.tight #hgCv{max-width:150px;height:72px}
#menu.tight .tag,#menu.tight .keys{display:none}
#menu.tight .logo{font-size:44px}
#menu.tight .hangar{gap:6px;padding:12px 16px}
#menu.tight .hg-lock{gap:2px 8px}

let ac = null, master = null;
function audioInit(){
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = muted ? 0 : .5; master.connect(ac.destination);
    setTimeout(musicStart, 0);
  } catch(e){ ac = null; }
}
function tone(freq, dur=.1, type='square', vol=.15, slide=0, delay=0){
  if (!ac || muted) return;
  const tt = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, tt);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), tt + dur);
  g.gain.setValueAtTime(vol, tt); g.gain.exponentialRampToValueAtTime(.0001, tt + dur);

const MUSIC = [
  {bpm:108, root:45, prog:[0,8,3,10], arp:[0,7,12,15,19,15,12,7], wave:'triangle'},
  {bpm:116, root:43, prog:[0,5,10,3], arp:[0,3,7,10,14,10,7,3],   wave:'sine'},
  {bpm:124, root:40, prog:[0,1,5,1],  arp:[0,4,7,8,12,8,7,4],     wave:'square'},
  {bpm:136, root:38, prog:[0,6,1,7],  arp:[0,1,6,7,12,13,12,6],   wave:'sawtooth'}
];
const mus = {on:false, zone:0, step:0, nextT:0, timer:0, gain:null, vol:-1, nbuf:null};
const mtof = n => 440*Math.pow(2, (n - 69)/12);
function musicStart(){
  if (!ac) return;
  if (!mus.gain){ mus.gain = ac.createGain(); mus.gain.gain.value = 0; mus.gain.connect(master);
    const n = ac.sampleRate*.05, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0); for (let i=0;i<n;i++) d[i] = Math.random()*2 - 1; mus.nbuf = b; }
  if (mus.on) return;
  mus.on = true; mus.step = 0; mus.nextT = ac.currentTime + .08; mus.timer = setInterval(schedMusic, 25);
}
function schedMusic(){
  if (!ac || !mus.on) return;
  const M = MUSIC[mus.zone], spb = 60/M.bpm/4;
  while (mus.nextT < ac.currentTime + .12){ playStep(M, mus.step, mus.nextT); mus.nextT += spb; mus.step = (mus.step + 1) % 64; }
}
function mnote(f, t0, dur, type, vol, cut){
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .008); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  if (cut){ const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = cut; o.connect(fl); fl.connect(g); } else o.connect(g);
  g.connect(mus.gain); o.start(t0); o.stop(t0 + dur + .03);
}
function playStep(M, st, t0){
  const bar = Math.floor(st/16) % 4, s = st % 16, root = M.root + M.prog[bar], playing = state === 'play';
  if (s % 4 === 0 || (mus.zone === 3 && s === 14)){ const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, t0); o.frequency.exponentialRampToValueAtTime(42, t0 + .12); g.gain.setValueAtTime(.55, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + .2); o.connect(g); g.connect(mus.gain); o.start(t0); o.stop(t0 + .22); }

  if (playing || s % 4 === 0) mnote(mtof(root + 12 + M.arp[s % 8] + (tier === 2 && playing ? 12 : 0)), t0, .14, M.wave, M.wave === 'sawtooth' || M.wave === 'square' ? .03 : .05, 3200);
  if (s === 0) mnote(mtof(root + 24), t0, 1.4, 'sine', .035);
}
function musicTick(){

function unlockBird(b){
  const p = priceOf(b), miss = Object.fromEntries(shortOf(p));
  if (shortOf(p).length) return toast(t('needMore') + ' · ' + costList(p, ' · ', k => miss[k] || 0));
  confirmDlg(t('confirmUnlock', {u:b.name, list: costList(p, ' + ')}), () => { if (isOwned(b) || shortOf(p).length) return; CUR.forEach(([k, w]) => { W[w] -= p[k]; }); owned.add(b.id); saveW(); celebrate(b); });
}

function roundRect(x,y,w,h,r){ w = Math.max(w, 0); r = Math.min(r, w/2, h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ---------- global leaderboard (artifact db) ---------- */
// One doc per player at scores/<uid>: {nick, cc, lang, best, gates, at, dailyKey, dailyScore}
let db = null, sb = null, backend = 'none', uid = null, myDoc = null, lbState = 'loading', readOnly = false;
let lbAll = [], lbDaily = [], lbTab = 'daily', unsubDaily = null, statusMsg = '', writeQ = Promise.resolve();

function subscribeDaily(){
  if (!db) return;
  if (unsubDaily) unsubDaily();
  const key = dayKey();
  unsubDaily = db.collection('scores').where('dailyKey','==',key).orderBy('dailyScore','desc').limit(50)
    .onSnapshot(s => { lbDaily = s.docs.map(d => ({id:d.id, ...d.data()})); renderLB(); }, () => {});
}
/* Supabase backend (public web build): anonymous auth + submit_score RPC. See supabase/schema.sql
   The SDK is fetched only when FW_CONFIG is filled in. Any failure (CDN blocked, bad config, sign-in refused, schema missing) leaves the game offline. */
const SDK_SRC = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js';   // exact version: the hash below is for this file only
const SDK_SRI = 'sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok';
const LB_COLS = 'player_id,nick,cc,best,bird,daily_key,daily_score,daily_bird';
const supaCfg = () => { const c = window.FW_CONFIG || {}; return c.supabaseUrl && c.supabaseAnonKey ? c : null; };
let sdkP = null, sbC = null, lbPoll = 0, needSync = false, lastRpc = 0, reauthP = null, dbP = null, dbAt = 0, dbBusy = false;
function loadSdk(){
  if (window.supabase && window.supabase.createClient) return Promise.resolve(true);
  if (sdkP) return sdkP;
  return sdkP = new Promise(res => {
    const el = document.createElement('script'); let done = false;
    const fin = ok => { if (done) return; done = true; clearTimeout(to); if (!ok){ sdkP = null; el.remove(); } res(ok); };
    const to = setTimeout(() => fin(false), 10000);
    el.src = SDK_SRC; el.integrity = SDK_SRI; el.crossOrigin = 'anonymous'; el.async = true;
    el.onload = () => fin(!!(window.supabase && window.supabase.createClient)); el.onerror = () => fin(false);
    document.head.appendChild(el);
  });
}
const fromRow = r => ({id:r.player_id, nick:r.nick, cc:r.cc, best:r.best, bird:r.bird, dailyKey:r.daily_key || '', dailyScore:r.daily_score, dailyBird:r.daily_bird});
async function refreshBoards(){
  if (!sb) return;
  try {
    const key = dayKey(), c = sb;
    const [a, d] = await Promise.all([
      c.from('fw_scores').select(LB_COLS).gt('best',0).order('best',{ascending:false}).limit(50),
      c.from('fw_scores').select(LB_COLS).eq('daily_key',key).gt('daily_score',0).order('daily_score',{ascending:false}).limit(50)
    ]);
    if (sb !== c) return;
    if (!a.error && a.data) lbAll = a.data.map(fromRow);
    if (!d.error && d.data) lbDaily = d.data.map(fromRow);
    renderLB();
  } catch(e){}
}
function sbOff(){ sb = null; backend = 'none'; uid = null; lbState = 'offline'; clearInterval(lbPoll); lbPoll = 0; renderLB(); }
// The stored session is gone or was refused: start a fresh anonymous player (a new leaderboard identity). Single flight.
function sbReauth(){
  if (reauthP) return reauthP;
  return reauthP = (async () => {
    try {
      try { await sbC.auth.signOut({scope: 'local'}); } catch(e){}
      const r = await sbC.auth.signInAnonymously(); if (r.error || !r.data || !r.data.session) throw r.error || new Error('session');
      uid = r.data.session.user.id; myDoc = null; needSync = true; return true;
    } catch(e){ sbOff(); return false; } finally { reauthP = null; }
  })();
}
const sbAuthErr = r => r.status === 401 || /fw_auth|jwt/i.test(String((r.error && r.error.message) || ''));
const sbRpc = async a => { try { return await sb.rpc('submit_score', a); } catch(e){ return {error: e || {}}; } };
async function initSupabase(cfg){
  try {
    if (!(await loadSdk())) throw new Error('sdk');
    if (!sbC){
      sbC = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false}});
      sbC.auth.onAuthStateChange((ev, s) => {   // keep this callback synchronous: no Supabase calls inside it
        if (backend !== 'supa') return;
        if (s && s.user){ if (uid !== s.user.id){ uid = s.user.id; myDoc = null; } }
        else if (ev === 'SIGNED_OUT' && !reauthP) setTimeout(() => { if (backend === 'supa' && !reauthP) sbReauth().then(ok => { if (ok) syncLocal(); }); }, 0);
      });
    }
    const mine = id => sbC.from('fw_scores').select(LB_COLS).eq('player_id', id).maybeSingle();
    let { data:{ session } } = await sbC.auth.getSession();
    if (!session){ const res = await sbC.auth.signInAnonymously(); if (res.error) throw res.error; session = res.data.session; }
    if (!session || !session.user) throw new Error('session');
    let me = await mine(session.user.id);
    if (me.error && me.status === 401){   // stored token no longer valid for this project: one fresh sign-in
      try { await sbC.auth.signOut({scope: 'local'}); } catch(e){}
      const res = await sbC.auth.signInAnonymously(); if (res.error || !res.data.session) throw res.error || new Error('session');
      session = res.data.session; me = await mine(session.user.id);
    }
    if (me.error) throw me.error;
    uid = session.user.id; sb = sbC; backend = 'supa'; myDoc = me.data ? fromRow(me.data) : null;
    lbState = 'online'; await refreshBoards();
    if (!lbPoll) lbPoll = setInterval(() => { if (!sb || document.hidden) return; if (needSync) syncLocal(); if (lbOpen || state === 'over') refreshBoards(); }, 20000);
    syncLocal();
  } catch(e){ sbOff(); }
}
// Push what this device has and the board lacks: a best or today's daily made offline, before sign-in finished, or whose submit failed.
function syncLocal(){
  needSync = false; if (backend !== 'supa' || !uid) return;
  const k = dayKey(), dl = dailyBestLocal(k), dg = store.get('fw27_dg', null);
  if (best > ((myDoc && myDoc.best) || 0) && best !== store.get('fw27_rej', 0)) submitScore(best, store.get('fw27_bestg', 0), 'endless', k);
  if (dg && dg.k === k && dl > ((myDoc && myDoc.dailyKey === k && myDoc.dailyScore) || 0)) submitScore(dl, dg.g, 'daily', k);
}
async function initDB(){
  const cfg = supaCfg();
  if (cfg) return initSupabase(cfg);
  try {
    const c = window.claude;
    if (!c || typeof c.use !== 'function'){ lbState = 'offline'; renderLB(); return; }
    const [d, u] = await Promise.all([c.use('db'), c.use('user')]);
    if (!d){ lbState = 'offline'; renderLB(); return; }
    db = d; backend = 'artifact'; uid = u ? await u.id() : null;
    if (!uid) readOnly = true;
    if (uid){
      try { const s = await db.doc('scores/' + uid).get(); if (s.exists) myDoc = {...s.data()}; } catch(e){}
    }
    db.collection('scores').orderBy('best','desc').limit(50)
      .onSnapshot(s => { lbAll = s.docs.map(x => ({id:x.id, ...x.data()})); renderLB(); }, () => {});
    subscribeDaily();
    lbState = 'online'; renderLB();
    // push a local best made before the board was reachable
    if (uid && best > ((myDoc && myDoc.best) || 0)) submitScore(best, 0, 'endless', dayKey());
  } catch(e){ lbState = 'offline'; renderLB(); }
}
// Single flight. A failed Supabase start-up is tried again when the player opens the board or versus (at most every 15 s).
function online(){
  if (dbP && (dbBusy || backend !== 'none' || !supaCfg() || Date.now() - dbAt < 15000)) return dbP;
  dbBusy = true; dbAt = Date.now();
  return dbP = initDB().catch(() => {}).then(() => { dbBusy = false; });
}
function submitScore(sc, gp, m, key){
  if (backend === 'none' || !uid || readOnly){ if (supaCfg()) needSync = true; return; }   // not signed in yet: syncLocal() sends it later
  writeQ = writeQ.then(async () => {
    const doc = Object.assign({nick, cc:CC, lang, best:0, gates:0, at:0, dailyKey:'', dailyScore:0}, myDoc || {});
    let changed = false;
    if (sc > (doc.best||0)){ doc.best = sc; if (gp) doc.gates = gp; doc.at = Date.now(); doc.bird = B.id; changed = true; }
    if (m === 'daily' && key === dayKey()){
      if (doc.dailyKey !== key){ doc.dailyKey = key; doc.dailyScore = 0; }
      if (sc > (doc.dailyScore||0)){ doc.dailyScore = sc; doc.dailyBird = B.id; changed = true; }
    }
    if (doc.nick !== nick || doc.cc !== CC){ doc.nick = nick; doc.cc = CC; changed = true; }
    doc.lang = lang;
    if (!changed || (doc.best <= 0 && doc.dailyScore <= 0)) return;
    if (backend === 'supa'){
      const args = { p_score: sc, p_gates: gp || 0, p_mode: m, p_day: key, p_bird: B.id, p_nick: nick, p_cc: CC, p_lang: lang }, sent = {nick, cc: CC};
      const gap = 2300 - (Date.now() - lastRpc); if (gap > 0) await new Promise(r => setTimeout(r, gap));   // the server wants 2 s between submits
      let r = await sbRpc(args);
      if (r.error && sbAuthErr(r) && await sbReauth()) r = await sbRpc(args);
      lastRpc = Date.now();
      if (backend !== 'supa') return;
      if (!r.error){ myDoc = r.data && r.data.player_id ? Object.assign(fromRow(r.data), sent) : doc; statusMsg = t('posted'); refreshBoards(); }
      else {
        const msg = String(r.error.message || '');
        if (/fw_(bad_input|implausible)/.test(msg)){ statusMsg = t('lbReject'); if (sc === best) store.set('fw27_rej', sc); }
        else { statusMsg = t(/fw_rate_limited/.test(msg) ? 'lbRate' : 'lbRetry'); needSync = true; }
      }
    } else {
      try { await db.doc('scores/' + uid).set(doc); myDoc = doc; statusMsg = t('posted'); }
      catch(e){ if (e && e.code === 'invalid_argument'){ readOnly = true; statusMsg = t('readOnly'); } }
    }
    renderLB();
  }).catch(() => {});   // one failed write must not block every later one
}

const flag = cc => /^[A-Z]{2}$/.test(cc || '') ? String.fromCodePoint(...[...cc].map(ch => 127397 + ch.charCodeAt(0))) : '🌐';
function myPlace(list){ const i = list.findIndex(r => r.id === uid); return i >= 0 ? i + 1 : 0; }
function renderLB(){

function netInit(){

    if (supaCfg()){ await online(); if (sb){ netKind = 'supa'; return; } }

}
async function netJoin(name){

      set: o => { R.presence(o).catch(() => {}); }, onChange: f => { cb = f; },

  }

      set: o => { mine = Object.assign({}, mine, o); tx.send(); }, onChange: f => { cb = f; },

      set: o => { if (gone) return; mine = Object.assign({}, mine, o); tx.send(); }, onChange: f => { cb = f; },

}
